# Configuração de Proxy Reverso Nginx - LAUF Site Oficial
# O Frontend é servido estaticamente pelo Nginx a partir de /var/www/lauf-site-oficial/apps/frontend/dist
# O Backend roda em container Docker expondo 127.0.0.1:3000
#
# PADRÃO SEGURO DE DIRETÓRIOS (FHS):
# O repositório deve ser clonado em /var/www/lauf-site-oficial (nunca na pasta /root).
# Isso garante o isolamento da pasta /root e permite que o Nginx (www-data) leia o build
# com permissões restritas sem comprometer a segurança do sistema.
# Permissões recomendadas na VPS:
# sudo chown -R $USER:www-data /var/www/lauf-site-oficial
# sudo chmod -R 755 /var/www/lauf-site-oficial

# Definição dos limites de requisições por IP (Segurança)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

server {
    listen 80;
    server_name laufoficial.site www.laufoficial.site;

    # 1. Servir o Frontend Estático (Vite build)
    location / {
        root /var/www/lauf-site-oficial/apps/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Reverso Geral da API (Encaminha para o container NestJS em 127.0.0.1:3000)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000/; # A barra no final limpa o prefixo "/api/" ao mandar para o NestJS
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy Reverso Específico para Autenticação (Com limite mais rígido anti-brute force)
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000/auth/; # Limpa "/api/auth/" e joga para "/auth/" no NestJS
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
