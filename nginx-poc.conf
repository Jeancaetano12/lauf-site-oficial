server {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
    ;
    listen 80;
    server_name laufoficial.site;

    # 1. Servir o Frontend Estático
    location / {
        root /root/lauf-site-oficial/apps/frontend/dist;
        index index.html index.htm;
        # Para que o React Router funcione corretamente
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Reverso para a API (Backend)
    # Como o backend estará rodando no seu Windows (Host) e o Nginx no Docker, 
    # usamos "host.docker.internal" para acessar o localhost do seu computador.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://localhost:3000/auth/;
    }
}
