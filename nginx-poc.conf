server {
    listen 80;
    server_name localhost;

    # 1. Servir o Frontend Estático
    location / {
        root /root/lauf-site-oficial/apps/frontend/dist;
        index index.html index.htm;
        # Para que o React Router funcione corretamente
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Reverso para a API (Backend)
    # Como o backend estará rodando no seu Windows (Host) e o Nginx no Docker, 
    # usamos "host.docker.internal" para acessar o localhost do seu computador.
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
