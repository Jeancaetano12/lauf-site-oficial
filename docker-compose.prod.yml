version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lauf_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword_prod_secure
      POSTGRES_DB: lauf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M # Proteje sua VPS limitando quantia de RAM do banco de dados

