name: CI Pipeline

# Dispara a action sempre que um Pull Request for aberto para a branch "main" ou quando houver push direto nela
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Validar Código (Lint, Tipagem, Build e Testes)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 📦 Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 📦 Instalar Dependências (Monorepo)
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build do Pacote Compartilhado (@lauf/shared)
        run: pnpm --filter @lauf/shared build

      - name: 🗄️ Gerar Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: 🔍 Validar Lint (Backend e Frontend)
        run: pnpm lint

      - name: 🏷️ Validar Tipagem Estrita (Typecheck)
        run: pnpm typecheck

      - name: 🏗️ Build de Todos os Workspaces
        run: pnpm build

      - name: 🧪 Rodar Testes Unitários
        run: pnpm test
